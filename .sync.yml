# This file can be used to customize the files managed by PDK.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/README.md
# for more information.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/config_defaults.yml
# for the default values.
---
Gemfile:
  required:
    # The acceptance tests run on Beaker (voxpupuli-acceptance) rather than
    # Litmus, whose gems would conflict with it.
    ':system_tests': ['---']
  optional:
    ':development':
      # Provides metadata2gha, which builds the CI matrices from metadata.json.
      # Only used by the static validation job, and it needs Ruby >= 3.2.
      - gem: puppet_metadata
        version: '~> 6.0'
        condition: "Gem::Requirement.create(['>= 3.2.0']).satisfied_by?(Gem::Version.new(RUBY_VERSION.dup))"
    ':system_tests':
      - gem: voxpupuli-acceptance
        version: '~> 4.0'
  overrides:
    # Newer fact sets than the template defaults (Debian 13, EL 10,
    # Ubuntu 24.04). The 4.x / 6.x series require Ruby 3.2, which Puppet 8
    # runs on; the lower bounds keep the lock file shipped with the PDK
    # usable.
    - gem: facterdb
      version: ['>= 3.10', '< 5']
    - gem: rspec-puppet-facts
      version: ['>= 5.4', '< 7']
    # voxpupuli-acceptance needs puppet-modulebuilder 2, which the
    # puppet-blacksmith 7 of the template does not support.
    - gem: puppet-blacksmith
      version: '~> 9.0'
