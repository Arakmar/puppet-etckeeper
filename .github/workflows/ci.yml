---
# The static validations and the unit tests come from the Vox Pupuli
# reusable workflow (https://github.com/voxpupuli/gha-puppet, beaker.yml):
# rake validate (syntax, metadata, REFERENCE.md freshness), lint and check,
# RuboCop, then the unit tests on every OpenVox major version of
# metadata.json, each with the Ruby its packages ship, and the acceptance
# tests on each supported OS in a container with the OpenVox packages (Arch
# Linux with its own Puppet package).
#
# release.yml calls it before publishing a tag.

name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  puppet:
    name: Puppet
    uses: voxpupuli/gha-puppet/.github/workflows/beaker.yml@v4

  tests:
    name: Test suite
    if: always()
    needs:
      - puppet
    runs-on: ubuntu-24.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
